name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Package (Windows Setup & Portable)
        run: npx tauri build

      - name: Organize Windows Build Outputs
        shell: bash
        run: |
          mkdir -p dist-windows
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} dist-windows/ContextPad_1.11.0_x64_Setup.exe \; 2>/dev/null || true
          if [ -f src-tauri/target/release/contextpad.exe ]; then
            cp src-tauri/target/release/contextpad.exe dist-windows/ContextPad_1.11.0_x64_Portable.exe
          fi
          ls -la dist-windows

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextPad_1.11.0_Windows_Executables
          path: dist-windows/*

      - name: Publish GitHub Release (Windows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RELEASE_TAG="v1.11.0-windows-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$RELEASE_TAG" dist-windows/* --title "ContextPad v1.11.0 Windows Build ($RELEASE_TAG)" --notes "Automated Windows setup installer and portable executable release." || true
