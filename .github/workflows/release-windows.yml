name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from package.json
        run: npm run version:sync

      - name: Build Tauri Package (Windows Setup & Portable)
        run: npx tauri build

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Organize Windows Build Outputs
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist-windows
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} dist-windows/ContextPad_${VERSION}_x64_Setup.exe \; 2>/dev/null || true
          if [ -f src-tauri/target/release/contextpad.exe ]; then
            cp src-tauri/target/release/contextpad.exe dist-windows/ContextPad_${VERSION}_x64_Portable.exe
          fi
          ls -la dist-windows

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextPad_${{ steps.version.outputs.version }}_Windows_Executables
          path: dist-windows/*

      - name: Publish GitHub Release (Windows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="v${VERSION}-windows-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$RELEASE_TAG" dist-windows/* --title "ContextPad v${VERSION} Windows Build ($RELEASE_TAG)" --notes "Automated Windows setup installer and portable executable release."
