name: Build Linux Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from package.json
        run: npm run version:sync

      - name: Build Tauri Package
        run: npx tauri build

      - name: Get Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload Linux .deb Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextPad_${{ steps.version.outputs.version }}_amd64
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="v${VERSION}-linux-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$RELEASE_TAG" src-tauri/target/release/bundle/deb/*.deb --title "ContextPad v${VERSION} Linux Release ($RELEASE_TAG)" --notes "Automated Linux .deb installer package release."
